name: enrich

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: "race_id"
        default: "24hultim2026"
      model:
        description: "modele de vent"
        default: "arome"
        type: choice
        options: [arome, ecmwf_ifs, era5]

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          PYTHONPATH: src
        run: python src/enrich.py --race-id "${{ inputs.race_id }}" --model "${{ inputs.model }}"
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          git diff --staged --quiet || git commit -m "enrichissement ${{ inputs.model }}"
          git push
